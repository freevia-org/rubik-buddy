name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # versionCode is derived from the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # No secrets are needed: google-services.json and signing keys are optional.
      - name: Unit tests
        run: ./gradlew :rubik-model:jvmTest :rubik-vision:testAndroidHostTest :rubik-solver:testAndroidHostTest --console=plain

      - name: Build debug APK and release bundle
        run: ./gradlew :composeApp:assembleDebug :composeApp:bundleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: rubik-buddy-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
