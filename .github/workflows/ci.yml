name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new push cancels the superseded run. main: every commit gets its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android build and unit tests
    runs-on: rubik-buddy-i5-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0   # versionCode is derived from the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      # No secrets are needed: google-services.json and signing keys are optional.
      # Unit tests run first so a failing test is reported before the slower packaging step.
      - name: Unit tests
        run: ./gradlew :rubik-model:jvmTest :rubik-vision:testAndroidHostTest :rubik-solver:testAndroidHostTest --console=plain

      - name: Build debug APK and release bundle
        run: ./gradlew :composeApp:assembleDebug :composeApp:bundleRelease --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: rubik-buddy-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
