name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator tests and unsigned iPhone archive
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate App Store metadata and screenshot assets
        run: python3 scripts/validate-app-store.py

      - name: Build simulator app and native solver
        run: ./scripts/build-ios.sh

      - name: Select an installed simulator for native tests
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())
          phones = [d for runtime, devices in data['devices'].items() if '.iOS-' in runtime for d in devices if 'iPhone' in d['name']]
          if not phones:
              raise SystemExit('No installed iPhone simulator runtime')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IOS_SIMULATOR_UDID=' + phones[0]['udid'] + '\n')
          PY

      - name: Test iOS vision and native solver
        run: |
          set -o pipefail
          ./scripts/test-ios-native.sh 2>&1 | tee build/ios-native-tests.log

      - name: Archive Release for iPhone (no signing credentials required)
        run: ./scripts/archive-ios.sh

      - name: Package App Store preparation kit
        run: ./scripts/package-app-store.sh

      - name: Package simulator app
        run: ditto -c -k --keepParent build/xcode-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app build/RubikBuddy-simulator.zip

      - uses: actions/upload-artifact@v6
        with:
          name: ios-builds-and-test-results
          path: |
            build/RubikBuddy-simulator.zip
            build/RubikBuddy-AppStore-Preparation.zip
            build/RubikBuddy-AppStore-Preparation.zip.sha256
            build/ios-device/*.zip
            build/ios-device/*.sha256
            build/ios-device/BUILD-INFO-*.txt
            build/ios-device/VALIDATION-*.json
            build/ios-native-tests.log
          if-no-files-found: error
