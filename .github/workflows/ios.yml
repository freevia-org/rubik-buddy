name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new push cancels the superseded run. main: every commit gets its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator:
    name: Simulator app and native tests
    runs-on: rubik-buddy-macmini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1   # the simulator build does not use the commit count

      - name: Validate App Store metadata and screenshot assets
        run: python3 scripts/validate-app-store.py

      - name: Show selected Xcode
        run: xcodebuild -version

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native toolchain, LLVM and its per-target compiler caches (not covered by setup-gradle).
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Build simulator app and native solver
        run: ./scripts/build-ios.sh

      - name: Select an installed simulator for native tests
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())
          phones = [d for runtime, devices in data['devices'].items() if '.iOS-' in runtime for d in devices if 'iPhone' in d['name']]
          if not phones:
              raise SystemExit('No installed iPhone simulator runtime')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IOS_SIMULATOR_UDID=' + phones[0]['udid'] + '\n')
          PY

      - name: Test iOS vision and native solver
        run: |
          set -o pipefail
          ./scripts/test-ios-native.sh 2>&1 | tee build/ios-native-tests.log

      - name: Package simulator app
        run: ditto -c -k --keepParent build/xcode-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app build/RubikBuddy-simulator.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-and-test-results
          path: |
            build/RubikBuddy-simulator.zip
            build/ios-native-tests.log
          if-no-files-found: error

  archive:
    name: Unsigned iPhone archive and App Store kit
    runs-on: rubik-buddy-macmini
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0   # the build number is derived from the commit count

      - name: Validate App Store metadata and screenshot assets
        run: python3 scripts/validate-app-store.py

      - name: Show selected Xcode
        run: xcodebuild -version

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      # Restore only: the simulator job owns saving this cache.
      - name: Restore Kotlin/Native toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Archive Release for iPhone (no signing credentials required)
        run: ./scripts/archive-ios.sh

      - name: Package App Store preparation kit
        run: ./scripts/package-app-store.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ios-archive-and-app-store-kit
          path: |
            build/RubikBuddy-AppStore-Preparation.zip
            build/RubikBuddy-AppStore-Preparation.zip.sha256
            build/ios-device/*.zip
            build/ios-device/*.sha256
            build/ios-device/BUILD-INFO-*.txt
            build/ios-device/VALIDATION-*.json
          if-no-files-found: error
